name: Publish and deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to update
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend
        working-directory: backend
        run: |
          python -m pip install -e ".[test]"
          python -m pytest

      - name: Check out infrastructure
        uses: actions/checkout@v4
        with:
          repository: olomg48/receipts_infra
          ref: main
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/olomg48/receipt-tracker-backend:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/olomg48/receipt-tracker-frontend:${{ github.sha }}

      - name: Mirror PostgreSQL to GHCR for dev
        if: inputs.environment == 'dev'
        uses: docker/build-push-action@v6
        with:
          context: infra/images/postgres
          push: true
          tags: ghcr.io/olomg48/receipt-tracker-postgres:17-alpine

      - name: Update image tags
        working-directory: infra
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          sed -i "s/^    newTag:.*/    newTag: ${IMAGE_TAG}/" \
            "overlays/${DEPLOY_ENVIRONMENT}/kustomization.yaml"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "overlays/${DEPLOY_ENVIRONMENT}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "Image tags already match this commit."
            exit 0
          fi
          git commit -m "Deploy ${DEPLOY_ENVIRONMENT} ${IMAGE_TAG:0:12}"
          git push origin main
